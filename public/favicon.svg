<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- host page (outline) -->
  <rect x="88" y="104" width="272" height="248" rx="40" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="30"/>
  <!-- embedded frame (solid, on top) -->
  <rect x="196" y="204" width="236" height="216" rx="36" fill="#fff" filter="url(#shadow)"/>
  <!-- message lines inside the frame -->
  <rect x="232" y="252" width="128" height="26" rx="13" fill="#6366f1"/>
  <rect x="232" y="300" width="164" height="26" rx="13" fill="#0ea5e9" fill-opacity="0.75"/>
  <rect x="232" y="348" width="96" height="26" rx="13" fill="#6366f1" fill-opacity="0.45"/>
</svg>
